<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10X CRM | Clients</title>
<script>
  if (localStorage.getItem("crm_theme") === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
  }
</script>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="logo" href="dashboard.html">10X CRM</a>
        <nav>
          <a href="dashboard.html">Dashboard</a>
          <a class="active" href="clients.html">Clients</a>
          <a href="profile.html">Profile</a>
        </nav>
        <button id="themeToggle" class="ghost-btn" type="button">Toggle theme</button>
        <button id="logoutBtn" class="ghost-btn danger" type="button">Log out</button>
      </aside>
      <main class="main-content">
        <header class="page-header">
          <div>
            <p class="eyebrow">Client database</p>
            <h1>Clients</h1>
          </div>
          <button id="openClientModal" class="primary-btn" type="button">Add client</button>
        </header>

        <section class="toolbar" aria-label="Client filters">
          <input id="searchInput" type="search" placeholder="Search by name, email, company, or city" />
          <select id="statusFilter" aria-label="Filter by status">
            <option value="all">All statuses</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="qualified">Qualified</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
          </select>
          <select id="sortSelect" aria-label="Sort clients">
            <option value="newest">Newest first</option>
            <option value="name">Name A-Z</option>
            <option value="value">Deal value</option>
          </select>
          <button id="exportCsvBtn" class="ghost-btn" type="button">Export CSV</button>
        </section>

        <section class="chips" id="statusChips" aria-label="Quick status filters"></section>

        <section class="panel table-panel">
          <div id="clientState" class="state-message">Loading clients...</div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Company</th>
                  <th>Status</th>
                  <th>Value</th>
                  <th>City</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="clientsTable"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="clientModal">
      <form id="clientForm" method="dialog" novalidate>
        <div class="modal-heading">
          <h2 id="clientModalTitle">Add client</h2>
          <button class="icon-btn" value="cancel" type="button" id="closeClientModal" aria-label="Close">x</button>
        </div>
        <input id="clientId" type="hidden" />
        <div class="form-grid">
          <label>Name<input id="clientName" required /><span class="field-error" data-error-for="clientName"></span></label>
          <label>Email<input id="clientEmail" type="email" required /><span class="field-error" data-error-for="clientEmail"></span></label>
          <label>Phone<input id="clientPhone" required /><span class="field-error" data-error-for="clientPhone"></span></label>
          <label>Company<input id="clientCompany" required /><span class="field-error" data-error-for="clientCompany"></span></label>
          <label>City<input id="clientCity" required /><span class="field-error" data-error-for="clientCity"></span></label>
          <label>Deal value<input id="clientValue" type="number" min="0" step="100" required /><span class="field-error" data-error-for="clientValue"></span></label>
          <label>Status
            <select id="clientStatus">
              <option value="new">New</option>
              <option value="contacted">Contacted</option>
              <option value="qualified">Qualified</option>
              <option value="won">Won</option>
              <option value="lost">Lost</option>
            </select>
          </label>
        </div>
        <menu>
          <button class="ghost-btn" type="button" id="cancelClientForm">Cancel</button>
          <button class="primary-btn" type="submit">Save client</button>
        </menu>
      </form>
    </dialog>

    <dialog id="detailsModal">
      <div class="modal-heading">
        <h2 id="detailsTitle">Client details</h2>
        <button class="icon-btn" type="button" id="closeDetailsModal" aria-label="Close">x</button>
      </div>
      <div id="detailsBody"></div>
      <form id="noteForm" class="note-form">
        <label>New note<textarea id="noteText" rows="3" required></textarea></label>
        <button class="primary-btn" type="submit">Add note</button>
      </form>
      <form id="reminderForm" class="note-form">
        <label>Reminder text<input id="reminderText" placeholder="Call back about proposal" required /></label>
        <label>Reminder time<input id="reminderTime" type="datetime-local" required /></label>
        <button class="primary-btn" type="submit">Set reminder</button>
      </form>
      <div class="call-box">
        <span id="callTimer">00:00</span>
        <button id="callToggle" class="ghost-btn" type="button">Start call</button>
      </div>
    </dialog>

    <div id="toastHost" class="toast-host"></div>
    <script type="module" src="assets/js/clients.js"></script>
  </body>
</html>
